{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card card-custom">
            <div class="card-header bg-primary-custom text-white text-center">
                <h4 class="mb-0"><i class="fas fa-file-pdf mr-2"></i>Generador de Especificaciones</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="form-group">
                        <label>Usuario</label>
                        <input type="text" name="username" class="form-control input-custom" required autofocus>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" name="password" class="form-control input-custom" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom btn-block">
                        <i class="fas fa-sign-in-alt mr-1"></i>Ingresar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
